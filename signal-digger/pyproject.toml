[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-digger"
version = "0.1.0"
description = "On-demand deep research CLI: M&A activity, staff movement, and quiet public signals for a company, sector, or person"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0",
  "feedparser>=6.0", "python-dateutil>=2.9", "pyyaml>=6.0", "click>=8.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.scripts]
digger = "digger.cli:main"

[tool.setuptools.packages.find]
include = ["digger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
