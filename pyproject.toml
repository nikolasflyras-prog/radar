[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinout-radar"
version = "0.5.0"
description = "Public-signal early detection for semiconductor founder spinouts"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31", "httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5.0",
  "feedparser>=6.0", "rapidfuzz>=3.6", "python-dateutil>=2.9",
  "jinja2>=3.1", "pyyaml>=6.0", "click>=8.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
