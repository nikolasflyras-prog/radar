name: ATTENUA Daily Intelligence

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: attenua-daily-intelligence
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: signal-digger
    env:
      DIGGER_CONTACT_EMAIL: ${{ secrets.DIGGER_CONTACT_EMAIL }}
      USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: signal-digger/pyproject.toml

      - name: Install Signal Digger
        run: pip install -e .

      - name: Prepare configuration
        run: |
          test -f config/config.yaml || cp config/config.example.yaml config/config.yaml
          test -f config/searches.yaml || cp config/searches.example.yaml config/searches.yaml

      - name: Request short-lived ATTENUA credential
        id: attenua-token
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken('https://boston-semiconductor-research.nfl77.chatgpt.site/api/intelligence/ingest')
          result-encoding: string

      - name: Run and publish daily edition
        env:
          ATTENUA_INGEST_TOKEN: ${{ steps.attenua-token.outputs.result }}
        run: digger --verbose daily --queries config/searches.yaml

      - name: Upload edition for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attenua-intelligence-${{ github.run_id }}
          path: signal-digger/output/daily/
          if-no-files-found: warn
          retention-days: 30
