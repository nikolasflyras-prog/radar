name: ATTENUA Daily Intelligence

on:
  schedule:
    - cron: "15 11 * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: "Website run-request identifier"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: attenua-daily-intelligence
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
      request_id: ${{ steps.decision.outputs.request_id }}
    steps:
      - name: Decide whether collection should run
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            const requestedId =
              context.eventName === 'workflow_dispatch'
                ? String(context.payload.inputs?.request_id || '').trim()
                : '';
            const isQueuePoll =
              context.eventName === 'schedule' &&
              context.payload.schedule === '*/5 * * * *';
            const isWebsiteDispatch =
              context.eventName === 'workflow_dispatch' &&
              requestedId.length > 0;

            if (!isQueuePoll && !isWebsiteDispatch) {
              core.setOutput('should_run', 'true');
              core.setOutput('request_id', '');
              core.info('Daily or manual run approved.');
              return;
            }

            const audience =
              'https://boston-semiconductor-research.nfl77.chatgpt.site/api/intelligence/run/claim';
            const token = await core.getIDToken(audience);
            const response = await fetch(audience, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json',
                'content-type': 'application/json',
              },
              body: JSON.stringify(requestedId ? { requestId: requestedId } : {}),
            });

            if (!response.ok) {
              core.setFailed(`Refresh queue check failed with HTTP ${response.status}`);
              return;
            }

            const result = await response.json();
            core.setOutput('should_run', result.claimed === true ? 'true' : 'false');
            core.setOutput('request_id', result.requestId || '');
            core.info(result.claimed ? `Website refresh request ${result.requestId} claimed.` : 'No matching website refresh request is waiting.');

  collect-and-publish:
    needs: decide
    if: needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: signal-digger
    env:
      DIGGER_CONTACT_EMAIL: ${{ secrets.DIGGER_CONTACT_EMAIL }}
      USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: signal-digger/pyproject.toml

      - name: Restore event history
        uses: actions/cache@v4
        with:
          path: signal-digger/data/daily.db
          key: attenua-daily-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            attenua-daily-state-

      - name: Install Signal Digger
        run: pip install -e .

      - name: Prepare configuration
        run: |
          test -f config/config.yaml || cp config/config.example.yaml config/config.yaml
          test -f config/searches.yaml || cp config/searches.example.yaml config/searches.yaml

      - name: Collect and save daily edition
        run: digger --verbose daily --no-publish --include-seen --queries config/searches.yaml

      - name: Request short-lived ATTENUA credential
        id: attenua-token
        uses: actions/github-script@v7
        with:
          script: return await core.getIDToken('https://boston-semiconductor-research.nfl77.chatgpt.site/api/intelligence/ingest')
          result-encoding: string

      - name: Publish daily edition
        env:
          ATTENUA_INGEST_TOKEN: ${{ steps.attenua-token.outputs.result }}
        run: digger publish output/daily/latest.json

      - name: Report a failed website run
        if: ${{ failure() && needs.decide.outputs.request_id != '' }}
        uses: actions/github-script@v7
        env:
          REQUEST_ID: ${{ needs.decide.outputs.request_id }}
        with:
          script: |
            const audience =
              'https://boston-semiconductor-research.nfl77.chatgpt.site/api/intelligence/run/report';
            const token = await core.getIDToken(audience);
            const response = await fetch(audience, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json',
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                requestId: process.env.REQUEST_ID,
                status: 'failed',
                message: `GitHub Actions run ${context.runId} failed before publication completed`,
              }),
            });
            if (!response.ok) {
              core.warning(`Could not report website run failure (HTTP ${response.status})`);
            }

      - name: Upload edition for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attenua-intelligence-${{ github.run_id }}
          path: signal-digger/output/daily/
          if-no-files-found: warn
          retention-days: 30
